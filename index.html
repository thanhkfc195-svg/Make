<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make File Tự Động [Jerry Mod] - Jerry Mod</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.88);
            --text-color: #f3f4f6;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --border-color: rgba(255, 255, 255, 0.12);
            --hover-color: rgba(16, 185, 129, 0.2);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        body {
            background-image: url('https://i.ibb.co/JwjpVd2c/25-E720-D4-5-B70-4-F3-A-A100-9-F071-C5-ACCF6.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 8px;
            font-size: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
        }
        .panel {
            background-color: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .header-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 0 0 10px var(--accent-glow);
            letter-spacing: 1px;
        }
        input, button {
            background-color: rgba(31, 41, 55, 0.9);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        button, .btn-link {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
        }
        button:active, .btn-link:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        .search-box, .edit-box {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .search-box input, .edit-box input {
            flex: 1;
        }
        
        /* Khung chứa bảng Hex chuẩn mực, không bị tràn/chèn chữ */
        .table-container {
            width: 100%;
            height: 330px;
            overflow-y: auto;
            overflow-x: auto;
            background-color: rgba(3, 7, 18, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        table.hex-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        table.hex-table th, table.hex-table td {
            padding: 6px 4px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
        }
        table.hex-table th {
            background-color: rgba(17, 24, 39, 0.98);
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .col-offset {
            width: 75px;
            color: #9ca3af;
            border-right: 1px solid var(--border-color);
            text-align: center;
            background-color: rgba(15, 23, 42, 0.5);
        }
        .col-hex {
            width: 360px;
            border-right: 1px solid var(--border-color);
            padding-left: 8px;
        }
        .col-ascii {
            width: 140px;
            color: var(--accent-color);
            padding-left: 8px;
        }
        .hex-byte {
            cursor: pointer;
            padding: 1px 2px;
            border-radius: 3px;
            display: inline-block;
            text-align: center;
            width: 19px;
            transition: background 0.1s;
        }
        .hex-byte:hover {
            background-color: var(--hover-color);
            color: #fff;
        }
        .status-bar {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }
        .footer-credit {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-top: 4px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .footer-text {
            font-size: 11px;
            color: var(--accent-color);
            font-weight: bold;
            text-shadow: 0 0 8px var(--accent-glow);
        }
        .footer-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .footer-buttons a {
            flex: 1;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <div class="header-title">Make Tự Động [Jerry Mod]</div>
        <input type="file" id="fileInput" style="width: 100%;">
        <div class="status-bar" id="fileInfo">Trạng thái: Chưa chọn file.</div>
    </div>

    <div class="panel">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm Hex (VD: 486578) hoặc Text...">
            <button id="searchBtn">Tìm Kiếm</button>
        </div>
        <div class="edit-box" style="margin-top: 6px;">
            <input type="text" id="targetInput" placeholder="Giá trị cũ">
            <input type="text" id="replaceInput" placeholder="Giá trị mới">
            <button id="replaceBtn">Thay Thế</button>
        </div>
    </div>

    <div class="panel" style="padding: 4px;">
        <div class="table-container">
            <table class="hex-table">
                <thead>
                    <tr>
                        <th class="col-offset">Offset</th>
                        <th class="col-hex">Bytes (00-0F)</th>
                        <th class="col-ascii">ASCII Text</th>
                    </tr>
                </thead>
                <tbody id="hexTableBody">
                    <tr><td colspan="3" style="text-align:center; color:#6b7280; padding:25px;">Đang chờ nạp dữ liệu tệp tin...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <button id="downloadBtn" style="width: 100%;">Tải Xuống File Đã Sửa</button>
    </div>
</div>

<div class="footer-credit">
    <div class="footer-text">Tool Bởi Jerry Mod</div>
    <div class="footer-buttons">
        <a href="https://zalo.me/0559376085" target="_blank" class="btn-link">Chat Zalo</a>
        <a href="https://t.me/jerry19_05" target="_blank" class="btn-link">Chat Telegram</a>
    </div>
</div>

<script>
    let fileBuffer = null;
    let uint8Array = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            fileBuffer = e.target.result;
            uint8Array = new Uint8Array(fileBuffer);
            document.getElementById('fileInfo').innerText = `File: ${file.name} | Kích thước: ${uint8Array.length} bytes`;
            renderHexTable();
        };
        reader.readAsArrayBuffer(file);
    });

    function renderHexTable() {
        if (!uint8Array) return;
        const tbody = document.getElementById('hexTableBody');
        let html = '';
        const bytesPerRow = 16;

        for (let i = 0; i < uint8Array.length; i += bytesPerRow) {
            let offsetHex = '0x' + i.toString(16).padStart(6, '0').toUpperCase();
            let hexBytesHtml = '';
            let asciiText = '';

            for (let j = 0; j < bytesPerRow; j++) {
                if (i + j < uint8Array.length) {
                    let byte = uint8Array[i + j];
                    let hex = byte.toString(16).padStart(2, '0').toUpperCase();
                    hexBytesHtml += `<span class="hex-byte" data-index="${i + j}">${hex}</span>`;
                    asciiText += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';
                } else {
                    hexBytesHtml += `<span class="hex-byte" style="visibility:hidden">00</span>`;
                    asciiText += ' ';
                }
            }
            html += `<tr>
                <td class="col-offset">${offsetHex}</td>
                <td class="col-hex">${hexBytesHtml}</td>
                <td class="col-ascii">${escapeHtml(asciiText)}</td>
            </tr>`;
        }
        tbody.innerHTML = html;

        document.querySelectorAll('.hex-byte[data-index]').forEach(el => {
            el.addEventListener('click', function() {
                let idx = parseInt(this.getAttribute('data-index'));
                let newVal = prompt(`Sửa Byte tại 0x${idx.toString(16)} (Hex 00-FF):`, this.innerText);
                if (newVal !== null && newVal.trim() !== '') {
                    let parsed = parseInt(newVal.trim(), 16);
                    if (!isNaN(parsed) && parsed >= 0 && parsed <= 255) {
                        uint8Array[idx] = parsed;
                        renderHexTable();
                    } else {
                        alert('Giá trị Hex không hợp lệ!');
                    }
                }
            });
        });
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('searchBtn').addEventListener('click', function() {
        if (!uint8Array) return;
        let query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        let searchBytes = parseInputToBytes(query);
        let foundIndex = -1;

        for (let i = 0; i <= uint8Array.length - searchBytes.length; i++) {
            let match = true;
            for (let j = 0; j < searchBytes.length; j++) {
                if (uint8Array[i + j] !== searchBytes[j]) {
                    match = false;
                    break;
                }
            }
            if (match) {
                foundIndex = i;
                break;
            }
        }

        if (foundIndex !== -1) {
            alert(`Đã tìm thấy tại offset: 0x${foundIndex.toString(16).toUpperCase()}`);
            let container = document.querySelector('.table-container');
            let rowIndex = Math.floor(foundIndex / 16);
            container.scrollTop = rowIndex * 25;
        } else {
            alert('Không tìm thấy kết quả khớp.');
        }
    });

    document.getElementById('replaceBtn').addEventListener('click', function() {
        if (!uint8Array) return;
        let target = document.getElementById('targetInput').value.trim();
        let replacement = document.getElementById('replaceInput').value.trim();
        if (!target || !replacement) {
            alert('Vui lòng nhập đầy đủ giá trị cũ và mới.');
            return;
        }

        let targetBytes = parseInputToBytes(target);
        let replaceBytes = parseInputToBytes(replacement);

        if (targetBytes.length !== replaceBytes.length) {
            alert('Độ dài giá trị cũ và mới phải khớp nhau tuyệt đối.');
            return;
        }

        let count = 0;
        for (let i = 0; i <= uint8Array.length - targetBytes.length; i++) {
            let match = true;
            for (let j = 0; j < targetBytes.length; j++) {
                if (uint8Array[i + j] !== targetBytes[j]) {
                    match = false;
                    break;
                }
            }
            if (match) {
                for (let j = 0; j < replaceBytes.length; j++) {
                    uint8Array[i + j] = replaceBytes[j];
                }
                count++;
                i += targetBytes.length - 1;
            }
        }

        if (count > 0) {
            alert(`Đã thay thế thành công ${count} vị trí.`);
            renderHexTable();
        } else {
            alert('Không tìm thấy chuỗi dữ liệu cần thay thế.');
        }
    });

    function parseInputToBytes(str) {
        let bytes = [];
        let clean = str.replace(/\s+/g, '');
        if (/^[0-9A-Fa-f]+$/.test(clean) && clean.length % 2 === 0) {
            for (let i = 0; i < clean.length; i += 2) {
                bytes.push(parseInt(clean.substr(i, 2), 16));
            }
        } else {
            for (let i = 0; i < str.length; i++) {
                bytes.push(str.charCodeAt(i));
            }
        }
        return bytes;
    }

    document.getElementById('downloadBtn').addEventListener('click', function() {
        if (!uint8Array) return;
        const blob = new Blob([uint8Array], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'edited_file.bin';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>

</body>
</html>
